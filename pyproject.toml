[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "prediction-bot"
version = "0.1.0"
description = "Offline-first NSE daily research and paper trading"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "streamlit>=1.42,<2",
    "pandas>=2.2,<3",
    "numpy>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
]

[project.scripts]
prediction-bot = "prediction_bot.cli:main"

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.54,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1", "mypy>=1.14,<2", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires a dedicated local PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/prediction_bot"]
